name: Numerical and GUI tests
on:
  push:
    branches: [main, mt-inv-gui]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pip check
      - run: python -m pytest -q -ra tests --junitxml=test-results.xml
      - name: Render desktop previews
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python tools/render_ui.py --output ui-previews --log-preview
      - name: Record complete environment
        if: always()
        run: python -m pip freeze > environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            test-results.xml
            environment.txt
            ui-previews/*.png
